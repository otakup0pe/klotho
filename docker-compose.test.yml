---
services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    working_dir: /app
    volumes:
      - .:/app
      - build_cache:/app/_build
      - rebar3_cache:/root/.cache/rebar3
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    command: ["make", "local-test"]

volumes:
  build_cache:
  rebar3_cache:


name: CI

on:
  push:
    branches: [mainline]
  pull_request:
    branches: [mainline]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: erlang:27-slim

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install build deps
        run: apt-get update && apt-get install -y make git curl

      - name: Install rebar3
        run: |
          curl -fsSL https://github.com/erlang/rebar3/releases/latest/download/rebar3 -o /usr/local/bin/rebar3
          chmod +x /usr/local/bin/rebar3

      - name: Run tests
        run: make local-test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Scan full history with Gitleaks
        run: make lint-secrets

  maybe_bump:
    needs: [test, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/mainline'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for version bump hint
        id: bump_check
        run: |
          LAST_TAG=$(git tag --merged HEAD --sort=-v:refname \
            | grep -Em1 '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${LAST_TAG}..HEAD"
          fi
          PART=$(git log --format=%B "$RANGE" | sh scripts/version-bump-part)
          echo "part=${PART}" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: next_version
        if: steps.bump_check.outputs.part != ''
        run: |
          python -m pip install avakas==3.0.14
          CURRENT=$(avakas show . --flavor git-native)
          PART=${{ steps.bump_check.outputs.part }}
          IFS='.' read -r MAJ MIN PAT <<< "$CURRENT"
          case "$PART" in
            major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN+1)); PAT=0 ;;
            patch) PAT=$((PAT+1)) ;;
          esac
          NEXT="${MAJ}.${MIN}.${PAT}"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Update version records
        if: steps.bump_check.outputs.part != ''
        env:
          CURRENT: ${{ steps.next_version.outputs.current }}
          NEXT: ${{ steps.next_version.outputs.next }}
        run: |
          grep -Fq "{vsn, \"${CURRENT}\"}" src/klotho.app.src
          grep -Fq "{tag, \"${CURRENT}\"}" README.md
          sed -i "s/{vsn, \"${CURRENT}\"}/{vsn, \"${NEXT}\"}/" src/klotho.app.src
          sed -i "s|{tag, \"${CURRENT}\"}|{tag, \"${NEXT}\"}|" README.md
          git diff --quiet -- src/klotho.app.src && {
            echo "src/klotho.app.src did not advance to ${NEXT}" >&2
            exit 1
          }
          git diff --quiet -- README.md && {
            echo "README.md did not advance to ${NEXT}" >&2
            exit 1
          }
          git add src/klotho.app.src README.md
          git commit -m "Version bumped to ${NEXT}"

      - name: Push version commit
        if: steps.bump_check.outputs.part != ''
        run: git push origin HEAD:mainline

      - name: Bump version
        if: steps.bump_check.outputs.part != ''
        run: avakas bump . ${{ steps.bump_check.outputs.part }} --flavor git-native

      - name: Create GitHub release
        if: steps.bump_check.outputs.part != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.next_version.outputs.next }}
        run: |
          gh release create "${NEXT}" \
            --title "${NEXT}" \
            --notes "Release ${NEXT}. See CHANGELOG.md for details." \
            --verify-tag
